<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass Lottie Preview</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #151716;
        --muted: #6b7280;
        --card: #f6f7f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
      figure {
        margin: 0;
        border-radius: 20px;
        background: var(--card);
        padding: 16px;
      }
      .stage {
        aspect-ratio: 4 / 3;
      }
      figcaption {
        margin-top: 8px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Glass Lottie animations</h1>
      <p>Generated by scripts/generate-lottie.mjs. Each one loops seamlessly.</p>
      <div class="grid" id="grid"></div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script>
      const files = ["tiles-matrix", "tiles-wave", "tiles-cluster", "glass-ribbon", "glass-twist", "glass-ring"];
      const grid = document.getElementById("grid");
      window.players = {};
      for (const name of files) {
        const figure = document.createElement("figure");
        const stage = document.createElement("div");
        stage.className = "stage";
        stage.id = `stage-${name}`;
        const caption = document.createElement("figcaption");
        caption.textContent = `${name}.json`;
        figure.append(stage, caption);
        grid.append(figure);
        window.players[name] = lottie.loadAnimation({ container: stage, renderer: "svg", loop: true, autoplay: true, path: `./${name}.json` });
      }
    </script>
  </body>
</html>
